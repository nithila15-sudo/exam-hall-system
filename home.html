// Search function
document.getElementById('searchBtn').onclick = () => {
    let roll = document.getElementById('rollInput').value.trim();
    if (!roll) {
        alert("Please enter roll number");
        return;
    }
    let data = rollMap.get(roll);
    if (data) {
        localStorage.setItem('rollNumber', roll);
        localStorage.setItem('hall', data.hall);
        localStorage.setItem('branch', data.branch);
        localStorage.setItem('location', data.location);
        window.location.href = 'result.html';
    } else {
        alert("❌ Roll number " + roll + " not found!\n\nOnly I, II, III CSE rolls are supported.");
    }
};
document.getElementById('rollInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('searchBtn').click();
});
