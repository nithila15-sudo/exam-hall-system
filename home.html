        .suggestion-name{font-size:0.8rem;color:#4a627a;margin-left:10px}
        button{width:100%;padding:14px;background:#0b2b40;color:white;border:none;border-radius:60px;font-weight:bold;cursor:pointer;margin-top:10px}
        .nav-link{margin-top:1.5rem}
        .nav-link a{color:#2c7da0;text-decoration:none}
        small{display:block;margin-top:1rem;color:#4a627a}
    </style>
</head>

// Auto-suggest logic
const rollInput = document.getElementById('rollInput');
const suggestionsBox = document.getElementById('suggestionsBox');

rollInput.addEventListener('input', function() {
    const query = this.value.trim();
    
    if (query.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
    }
    
    // Find matching roll numbers
    const matches = [];
    for (let [roll, data] of rollDatabase) {
        if (roll.startsWith(query)) {
            matches.push({ roll, name: data.name });
            if (matches.length >= 8) break; // Max 8 suggestions
        }
    }
    
    if (matches.length > 0) {
        suggestionsBox.innerHTML = '';
        matches.forEach(match => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerHTML = `<span class="suggestion-roll">${match.roll}</span><span class="suggestion-name">${match.name}</span>`;
            div.onclick = () => {
                rollInput.value = match.roll;
                suggestionsBox.style.display = 'none';
                // Auto search after selection (optional)
                performSearch(match.roll);
            };
            suggestionsBox.appendChild(div);
        });
        suggestionsBox.style.display = 'block';
    } else {
        suggestionsBox.style.display = 'none';
    }
});

// Close suggestions when clicking outside
document.addEventListener('click', function(e) {
    if (e.target !== rollInput) {
        suggestionsBox.style.display = 'none';
    }
});

function performSearch(roll) {
    const data = rollDatabase.get(roll);
    if (data) {
        localStorage.setItem('rollNumber', roll);
        localStorage.setItem('hall', data.hall);
        localStorage.setItem('branch', data.branch);
        localStorage.setItem('location', data.location);
        window.location.href = 'result.html';
    } else {
        alert("❌ Roll number " + roll + " not found!");
    }
}

// Search button click
document.getElementById('searchBtn').onclick = () => {
    let roll = rollInput.value.trim();
    if (!roll) {
        alert("Please enter roll number");
        return;
    }
    const data = rollDatabase.get(roll);
    if (data) {
        localStorage.setItem('rollNumber', roll);
        localStorage.setItem('hall', data.hall);
        localStorage.setItem('branch', data.branch);
        localStorage.setItem('location', data.location);
        window.location.href = 'result.html';
    } else {
        alert("❌ Roll number " + roll + " not found!\n\nOnly I, II, III CSE rolls are supported.");
    }
};

rollInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        suggestionsBox.style.display = 'none';
        document.getElementById('searchBtn').click();
    }
});
</script>
