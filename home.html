// Auto-suggest logic

const suggestionsBox = document.getElementById('suggestionsBox');

rollInput.addEventListener('input', function() {
    const query = this.value.trim();
    
    if (query.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
    }
    
    // Find matching roll numbers
    const matches = [];
    for (let roll of rollList) {
        if (roll.startsWith(query)) {
            matches.push(roll);
            if (matches.length >= 10) break;
        }
    }
    
    if (matches.length > 0) {
        suggestionsBox.innerHTML = '';
        matches.forEach(roll => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerHTML = `<span class="suggestion-roll">${roll}</span>`;
            div.onclick = () => {
                rollInput.value = roll;
                suggestionsBox.style.display = 'none';
                performSearch(roll);
            };
            suggestionsBox.appendChild(div);
        });
        suggestionsBox.style.display = 'block';
    } else {
        suggestionsBox.style.display = 'none';
    }
});

    if (data) {

        localStorage.setItem('hall', data.hall);
        localStorage.setItem('branch', data.branch);
        localStorage.setItem('location', data.location);
        window.location.href = 'result.html';
    } else {
        alert("❌ Roll number " + roll + " not found!");
    }
}

// Search button click
